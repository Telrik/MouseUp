[workspace]

[package]
name = "mouseup-macos"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "MouseUp experimental macOS overlay"
build = "../linux/build.rs"

[[bin]]
name = "mouseup-macos"
path = "../linux/src/main.rs"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21.3"

[build-dependencies]
flate2 = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.build-override]
opt-level = 2
