name: Build Ubuntu X11 beta

on:
  push:
    tags: ['ubuntu-x11-v*-beta.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Build Ubuntu package
        env:
          CARGO_BUILD_JOBS: '2'
        run: sh linux/package.sh
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mouseup-ubuntu-x11-0.2.0-beta1-amd64.deb \
            --verify-tag --prerelease --latest=false --title 'MouseUp Ubuntu X11 beta' \
            --notes-file linux/release-notes.md
