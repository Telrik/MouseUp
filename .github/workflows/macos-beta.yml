name: Build macOS beta

on:
  push:
    tags: ['macos-v*-beta.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build universal macOS app
        env:
          CARGO_BUILD_JOBS: '2'
        run: sh macos/package.sh
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/dist/MouseUp-macOS-beta.zip \
            --verify-tag --prerelease --latest=false --title 'MouseUp macOS beta' \
            --notes-file macos/release-notes.md
