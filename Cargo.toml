[workspace]
members = ["crates/hook", "crates/hook-host"]
resolver = "2"

[package]
name = "mouseup"
version = "0.2.0"
edition = "2021"
description = "Custom cursors for Windows applications"
license = "MIT"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
flate2 = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
